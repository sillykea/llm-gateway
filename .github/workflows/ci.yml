name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      GATEWAY_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Test
        run: go test -race -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1
      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 100x ./...

  # What the gateway adds on top of a 50 ms model, at a steady 500 req/s,
  # with Redis-backed cache and shared limits.
  loadtest:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Start the gateway
        run: |
          go build -o gateway ./cmd/gateway && go build -o loadtest ./cmd/loadtest
          GATEWAY_API_KEY=load-key ./gateway -config configs/loadtest-redis.json > gateway.log 2>&1 &
          for i in $(seq 1 20); do curl -sf localhost:8080/healthz && break; sleep 0.5; done
      - name: Load test
        run: ./loadtest -key load-key -rate 500 -duration 20s -max-overhead-p99 50ms | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No shared-state errors
        run: |
          curl -s localhost:8080/metrics | grep -E '^llm_gateway_(shared_state_errors|cache|load_shed)' || true
          ! curl -s localhost:8080/metrics | grep -q '^llm_gateway_shared_state_errors_total'
      - name: Gateway log on failure
        if: failure()
        run: tail -50 gateway.log

  image:
    needs: [test, loadtest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/sillykea/llm-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
